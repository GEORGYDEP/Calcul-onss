<!DOCTYPE html>
<html lang="fr-BE">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Les rémunérations — Partie 2A : ONSS et bonus à l'emploi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0e14; --bg2:#0f151f; --bg3:#16202d; --card:#121b27;
  --accent:#3ae08c; --accent2:#1fa968; --orange:#ff9f43; --gold:#ffd166; --blue:#4aa8ff; --violet:#a78bfa;
  --text:#e9eff7; --text2:#9fb0c5; --text3:#6f8299;
  --border:#22303f; --radius:14px;
  --success:#3ae08c; --error:#ff5f6d; --warn:#ffc94d;
  --paper:#fdfdf9; --ink:#1d2733;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);
  background-image:radial-gradient(1100px 520px at 12% -8%,rgba(58,224,140,.10),transparent 60%),
                   radial-gradient(900px 460px at 96% 4%,rgba(255,159,67,.09),transparent 60%);
  background-attachment:fixed;line-height:1.55;-webkit-text-size-adjust:100%;
}
.mono{font-family:'Space Mono',monospace}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit}
.hidden{display:none !important}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
b,strong{font-weight:700}

/* ---------- HUD ---------- */
.topbar{position:sticky;top:0;z-index:60;background:rgba(10,14,20,.93);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.topbar-in{max-width:1120px;margin:0 auto;padding:9px 16px 6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.brand{font-weight:800;font-size:1rem;display:flex;align-items:center;gap:8px}
.brand .logo{font-size:1.25rem}
.spacer{flex:1}
.badge{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:var(--bg3);border:1px solid var(--border);font-size:.8rem;font-weight:600;white-space:nowrap}
.badge.acc{color:var(--accent);border-color:rgba(58,224,140,.35)}
.badge.org{color:var(--orange);border-color:rgba(255,159,67,.35)}
.badge.pulse{animation:pulse 1s ease-in-out infinite}
button.badge:hover{border-color:var(--accent)}
.hud2{max-width:1120px;margin:0 auto;padding:0 16px 9px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.xp-rank{font-size:.8rem;font-weight:700;white-space:nowrap}
.xpbar{position:relative;flex:1;min-width:140px;height:9px;background:var(--bg3);border-radius:6px;overflow:visible;border:1px solid var(--border)}
.xpfill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--gold));width:0;transition:width .6s ease}
.xpmark{position:absolute;top:-3px;width:2px;height:13px;background:var(--text3);border-radius:1px}
.xpmark.reached{background:var(--gold)}
.xp-next{font-size:.74rem;color:var(--text3);white-space:nowrap}
.navdots{display:flex;gap:6px}
.navdot{width:27px;height:27px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:800;background:var(--bg3);border:1.5px solid var(--border);color:var(--text2)}
.navdot.done{background:rgba(58,224,140,.15);border-color:var(--accent);color:var(--accent)}
.navdot.cur{border-color:var(--gold);color:var(--gold)}
.navdot.locked{opacity:.4;cursor:not-allowed}

/* ---------- LAYOUT ---------- */
.wrap{max-width:1000px;margin:0 auto;padding:18px 16px 60px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px}
.card+.card{margin-top:14px}
h1{font-size:1.8rem;font-weight:800;line-height:1.2}
h2{font-size:1.25rem;font-weight:800}
h3{font-size:1.02rem;font-weight:700}
.muted{color:var(--text2)}
.small{font-size:.86rem}
.tiny{font-size:.78rem}
.center{text-align:center}

/* ---------- BUTTONS ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:12px;font-weight:700;font-size:.92rem;background:var(--bg3);border:1px solid var(--border);color:var(--text);transition:transform .12s ease,background .18s ease,border-color .18s ease}
.btn:hover{transform:translateY(-2px);border-color:var(--text3)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#07130c;border:none}
.btn-gold{background:linear-gradient(135deg,var(--gold),var(--orange));color:#2b1400;border:none}
.btn-ghost{background:transparent}
.btn-acc-outline{background:transparent;border:1.5px solid var(--accent);color:var(--accent)}
.btn-acc-outline:hover{background:var(--accent);color:#07130c}
.btn-org-outline{background:transparent;border:1.5px solid var(--orange);color:var(--orange)}
.btn-org-outline:hover{background:var(--orange);color:#2b1400}
.btn-sm{padding:7px 12px;font-size:.8rem;border-radius:9px}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn-row.end{justify-content:flex-end}

/* ---------- WELCOME ---------- */
.hero{text-align:center;padding:30px 20px}
.hero .icon{font-size:3rem;line-height:1}
.hero h1{margin:12px 0 6px;font-size:2.1rem}
.hero .sub{color:var(--orange);font-weight:700;margin-bottom:12px}
.hero p{color:var(--text2);max-width:640px;margin:0 auto}
.counters{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin:22px auto 6px;max-width:720px}
.counter{background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:12px 8px}
.counter .v{font-size:1.4rem;font-weight:800;font-family:'Space Mono',monospace}
.counter .k{font-size:.74rem;color:var(--text3)}
.who{margin-top:14px;font-size:.84rem;color:var(--text2)}
.who b{color:var(--accent)}

/* ---------- PATH (hub) ---------- */
.path{position:relative;margin:18px 0 6px;padding:6px 0}
.path:before{content:'';position:absolute;left:50%;top:0;bottom:0;border-left:3px dashed var(--border);transform:translateX(-50%)}
.pnode-row{position:relative;display:flex;align-items:center;min-height:120px}
.pnode-row .pcard{width:calc(50% - 46px)}
.pnode-row.left{justify-content:flex-start}
.pnode-row.right{justify-content:flex-end}
.pnode{position:absolute;left:50%;transform:translateX(-50%);width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-family:'Space Mono',monospace;background:var(--bg3);border:3px solid var(--border);z-index:2;font-size:1rem}
.pnode.done{background:rgba(58,224,140,.18);border-color:var(--accent);color:var(--accent)}
.pnode.cur{border-color:var(--gold);color:var(--gold);box-shadow:0 0 0 0 rgba(255,209,102,.6);animation:ring 1.6s infinite}
.pnode.locked{opacity:.55}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(255,209,102,.55)}70%{box-shadow:0 0 0 14px rgba(255,209,102,0)}100%{box-shadow:0 0 0 0 rgba(255,209,102,0)}}
.pcard{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;text-align:left;transition:.16s;display:block}
button.pcard:hover{border-color:var(--gold);transform:translateY(-2px)}
.pcard.locked{opacity:.55;cursor:not-allowed}
.pcard .pi{font-size:1.5rem}
.pcard .pt{font-weight:800;font-size:.98rem;margin:2px 0}
.pcard .pd{font-size:.82rem;color:var(--text2)}
.pcard .pm{margin-top:7px;font-size:.78rem;color:var(--text3);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stars{color:var(--gold);letter-spacing:2px}
.trophies{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-top:12px}
.trophy{background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:11px;display:flex;gap:10px;align-items:flex-start}
.trophy .ti{font-size:1.6rem;line-height:1}
.trophy .tn{font-weight:700;font-size:.86rem}
.trophy .tc{font-size:.74rem;color:var(--text3)}
.trophy.off{opacity:.45;filter:grayscale(1)}
.trophy.on{border-color:rgba(255,209,102,.5);background:rgba(255,209,102,.07)}

/* ---------- BRIEF ---------- */
.brief-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.brief-h .bi{font-size:2.2rem}
.brief-h .bm{font-size:.8rem;color:var(--text3)}
.goals{background:rgba(58,224,140,.07);border:1px solid rgba(58,224,140,.3);border-radius:12px;padding:12px 14px;margin:10px 0}
.goals h3{font-size:.92rem;color:var(--accent);margin-bottom:5px}
.goals li{margin:3px 0 3px 18px;font-size:.9rem}
.theo{background:linear-gradient(135deg,rgba(74,168,255,.10),rgba(167,139,250,.07));border:1px solid rgba(74,168,255,.3);border-radius:12px;padding:12px 14px;margin:10px 0;font-size:.9rem;color:var(--text2)}
.theo h3{color:var(--blue);font-size:.92rem;margin-bottom:5px}
.theo b{color:var(--text)}
.theo ul{margin:5px 0 5px 18px}
.theo li{margin:3px 0}
.theo p+p{margin-top:6px}
.exbox{background:rgba(255,159,67,.08);border:1px solid rgba(255,159,67,.35);border-radius:12px;padding:12px 14px;margin:10px 0;font-size:.88rem;color:var(--text2)}
.exbox h3{color:var(--orange);font-size:.92rem;margin-bottom:5px}
.exbox b{color:var(--text)}
details.plus{background:rgba(255,209,102,.07);border:1px solid rgba(255,209,102,.35);border-radius:12px;padding:10px 14px;margin:10px 0;font-size:.86rem;color:var(--text2)}
details.plus summary{cursor:pointer;color:var(--gold);font-weight:700}
details.plus p{margin-top:7px}
.pred{margin:16px 0 6px;padding:14px;border-radius:12px;background:var(--bg3);border:1px solid var(--border)}
.pred h3{font-size:.95rem;margin-bottom:9px}
.pred .btn.on{border-color:var(--gold);color:var(--gold);background:rgba(255,209,102,.1)}
table.mini{width:100%;border-collapse:collapse;font-size:.82rem;margin-top:8px}
table.mini td,table.mini th{border-bottom:1px solid var(--border);padding:5px 7px;text-align:left}
table.mini th{color:var(--text3);font-size:.7rem;text-transform:uppercase;letter-spacing:.6px}
table.mini td.r,table.mini th.r{text-align:right;font-family:'Space Mono',monospace;white-space:nowrap}
.scroll{overflow-x:auto}

/* ---------- QUESTION ---------- */
.qtop{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.qtop .qm{font-weight:700;font-size:.92rem}
.qdots{display:flex;gap:6px;margin-left:auto}
.qdot{width:14px;height:14px;border-radius:50%;background:var(--bg3);border:1.5px solid var(--border)}
button.qdot{cursor:pointer}
.qdot.correct{background:var(--accent);border-color:var(--accent)}
.qdot.hint{background:var(--orange);border-color:var(--orange)}
.qdot.shown{background:var(--error);border-color:var(--error)}
.qdot.cur{background:var(--gold);border-color:var(--gold);box-shadow:0 0 8px var(--gold)}
.qtag{font-size:.74rem;font-family:'Space Mono',monospace;color:var(--text3);margin-bottom:8px}
.qtext{font-size:1.04rem;font-weight:600;margin-bottom:10px;line-height:1.5}
.qtext b{color:var(--gold)}
.data{display:block;background:var(--bg2);border:1px dashed var(--text3);border-radius:10px;padding:10px 13px;font-size:.88rem;color:var(--text2);margin:8px 0 12px;line-height:1.6}
.data b{color:var(--text)}
.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.opts{display:grid;gap:9px;margin-top:6px}
.opt{display:flex;gap:11px;align-items:flex-start;text-align:left;padding:12px 14px;border-radius:12px;background:var(--bg3);border:1.5px solid var(--border);font-size:.93rem;transition:.14s}
.opt:hover:not(:disabled){border-color:var(--blue);transform:translateX(3px)}
.opt .ol{flex:0 0 26px;height:26px;border-radius:7px;background:var(--bg2);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.8rem;font-family:'Space Mono',monospace}
.opt.good{border-color:var(--accent);background:rgba(58,224,140,.11)}
.opt.bad{border-color:var(--error);background:rgba(255,95,109,.09);opacity:.8}
.opt.miss{border:1.5px dashed var(--accent)}
.opt.sel{border-color:var(--blue);background:rgba(74,168,255,.1)}
.opt:disabled{cursor:default}
.vfrow{display:flex;gap:12px;flex-wrap:wrap;margin-top:6px}
.vfrow .opt{flex:1;min-width:140px;justify-content:center;font-weight:800;font-size:1rem}
.calcrow{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start;margin-top:6px}
.calcrow .inwrap{flex:1;min-width:200px}
.field{width:100%;background:var(--bg2);border:1.5px solid var(--border);border-radius:10px;padding:12px;color:var(--text);font-size:1rem}
.field:focus{outline:none;border-color:var(--accent)}
.field.mono{font-family:'Space Mono',monospace}
.calc-prev{font-family:'Space Mono',monospace;font-size:.8rem;color:var(--accent);min-height:1.3em;padding:4px 4px 0}
.unit{align-self:center;color:var(--text2);font-weight:700}
.appar{display:grid;gap:9px;margin-top:6px}
.arow{display:grid;grid-template-columns:minmax(150px,1fr) 2fr;gap:10px;align-items:center;background:var(--bg3);border:1.5px solid var(--border);border-radius:12px;padding:9px 11px}
.arow .at{font-weight:700;font-size:.92rem}
.arow select{width:100%;background:var(--bg2);border:1.5px solid var(--border);border-radius:9px;padding:9px;color:var(--text);font-size:.86rem}
.arow.numsel{grid-template-columns:1fr 150px}
.arow.ok1{border-color:var(--accent)} .arow.ok2{border-color:var(--orange)} .arow.ko{border-color:var(--error)}
.arow .fix{grid-column:1/-1;font-size:.82rem;color:var(--error)}
.bounce{animation:bounce .5s}
@keyframes bounce{0%,100%{transform:translateY(0)}30%{transform:translateY(-7px)}60%{transform:translateY(2px)}}
.bank{display:flex;flex-wrap:wrap;gap:8px;padding:12px;background:var(--bg2);border:1.5px dashed var(--border);border-radius:12px;min-height:58px;margin:8px 0}
.bank-l{font-size:.74rem;color:var(--text3);margin-top:6px}
.chip{padding:8px 12px;border-radius:10px;background:var(--bg3);border:1.5px solid var(--border);font-size:.86rem;font-weight:600;text-align:left;transition:.12s}
.chip:hover:not(:disabled){border-color:var(--blue)}
.chip.pick{border-color:var(--gold);background:rgba(255,209,102,.13);box-shadow:0 0 0 2px rgba(255,209,102,.25)}
.chip.ok1{border-color:var(--accent);background:rgba(58,224,140,.12)}
.chip.ok2{border-color:var(--orange);background:rgba(255,159,67,.12)}
.chip.ko{border-color:var(--error);background:rgba(255,95,109,.1)}
.chip .fix{display:block;font-size:.76rem;color:var(--error);font-weight:600;margin-top:2px}
.slots{display:grid;gap:8px;margin-top:6px}
.slot{display:flex;align-items:center;gap:10px;padding:7px 9px;border-radius:12px;background:var(--bg3);border:1.5px dashed var(--border);min-height:50px;text-align:left;width:100%}
.slot .sn{flex:0 0 28px;height:28px;border-radius:8px;background:var(--bg2);display:flex;align-items:center;justify-content:center;font-weight:800;font-family:'Space Mono',monospace;font-size:.82rem}
.slot.target{border-color:var(--gold)}
.slot .chip{flex:1}
.slot .ph{color:var(--text3);font-size:.84rem}
.zones{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:6px}
.zone{background:var(--bg3);border:1.5px dashed var(--border);border-radius:12px;padding:10px;min-height:120px;text-align:left;width:100%;display:flex;flex-direction:column;gap:7px;align-items:stretch}
.zone.target{border-color:var(--gold)}
.zone .zt{font-weight:800;font-size:.86rem;margin-bottom:3px}

/* ---------- FEEDBACK ---------- */
.fb{border-radius:11px;padding:12px 14px;margin-top:12px;font-size:.89rem;border-left:4px solid}
.fb-ok{background:rgba(58,224,140,.10);border-color:var(--accent)}
.fb-mid{background:rgba(255,159,67,.10);border-color:var(--orange)}
.fb-bad{background:rgba(255,95,109,.09);border-color:var(--error)}
.fb-hint{background:rgba(255,201,77,.09);border-color:var(--warn)}
.fb-exp{background:rgba(74,168,255,.08);border-color:var(--blue)}
.fb h4{font-size:.92rem;margin-bottom:5px;display:flex;align-items:center;gap:7px}
.fb ul{margin:4px 0 0 17px}
.fb li{margin:4px 0;color:var(--text2)}
.fb li b{color:var(--text)}
.fb .loc{font-family:'Space Mono',monospace;background:var(--bg3);padding:1px 6px;border-radius:5px;font-size:.8em;color:var(--orange)}
.fb p{color:var(--text2)} .fb p b{color:var(--text)}
.qnav{display:flex;justify-content:flex-end;gap:10px;margin-top:14px;flex-wrap:wrap}

/* ---------- BILAN ---------- */
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.84rem;color:var(--text2);margin:6px 0 12px}
table.bilan{width:100%;border-collapse:collapse;font-size:.86rem}
table.bilan th{background:var(--bg3);padding:8px;text-align:left;font-size:.68rem;text-transform:uppercase;letter-spacing:.6px;color:var(--text3)}
table.bilan td{padding:8px;border-bottom:1px solid var(--border)}
table.bilan td.c,table.bilan th.c{text-align:center;font-family:'Space Mono',monospace}
.grade{text-align:center;padding:10px 10px 4px}
.grade .medal{font-size:3.6rem;line-height:1}
.grade .gr{font-size:2rem;font-weight:800;margin:6px 0 2px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:14px 0}
.stat{background:var(--bg3);border:1px solid var(--border);border-radius:11px;padding:12px;text-align:center}
.stat .v{font-size:1.35rem;font-weight:800;font-family:'Space Mono',monospace}
.stat .k{font-size:.72rem;color:var(--text3)}
.predres{margin-top:10px;padding:11px 13px;border-radius:11px;background:rgba(255,209,102,.07);border:1px solid rgba(255,209,102,.3);font-size:.88rem}
.crit{border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-top:10px;background:var(--bg2)}
.crit-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-weight:800}
.st-badge{font-size:.74rem;font-weight:800;padding:3px 9px;border-radius:999px;white-space:nowrap}
.st-atteint{background:rgba(58,224,140,.15);color:var(--accent)}
.st-encours{background:rgba(255,159,67,.15);color:var(--orange)}
.st-nonatteint{background:rgba(255,95,109,.15);color:var(--error)}
.ind{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--border);margin-top:8px;font-size:.88rem;flex-wrap:wrap}
.ind .it{flex:1;min-width:200px}
.revoir{width:100%;font-size:.82rem;color:var(--text2);background:rgba(74,168,255,.07);border-radius:8px;padding:7px 10px}
.revoir i{color:var(--text)}

/* ---------- MODALS ---------- */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(8px);z-index:200;display:flex;align-items:center;justify-content:center;padding:14px}
.modal-box{background:var(--card);border:1px solid var(--border);border-radius:16px;width:100%;max-width:620px;max-height:88vh;display:flex;flex-direction:column;animation:slideUp .28s cubic-bezier(.2,.9,.3,1)}
@keyframes slideUp{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
.modal-h{display:flex;align-items:center;gap:10px;padding:15px 18px;border-bottom:1px solid var(--border)}
.modal-h h3{flex:1;font-size:1.02rem}
.modal-b{padding:18px;overflow:auto}
.modal-f{padding:14px 18px;border-top:1px solid var(--border);display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap}
.close-x{font-size:1.4rem;color:var(--text3);padding:0 5px;line-height:1}
.close-x:hover{color:var(--text)}
.err-msg{color:var(--error);font-size:.85rem;margin-top:9px;min-height:19px}
.ref-search{margin-bottom:10px}
.ref-list{max-height:52vh;overflow:auto}
.ref-item{display:flex;gap:10px;padding:7px 9px;border-bottom:1px solid var(--border);font-size:.86rem}
.ref-item .k{font-family:'Space Mono',monospace;color:var(--accent);font-weight:700;flex:0 0 70px}
.ref-item .v{color:var(--text2)}
.ref-grp{padding:12px 9px 4px;color:var(--orange);font-weight:800;font-size:.76rem;text-transform:uppercase;letter-spacing:.8px}
#lbOverlay{display:none;position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,.75);backdrop-filter:blur(8px)}

<script>
/* ============================================================

const TRACKING = {

  { id:'C1', nom:"Comprendre le passage du brut au net", indicateurs:[

/* ---------- Générateur des tableaux d'exercices (lignes exactes du cours) ---------- */
function bonusEx(o){
  const H = {
    base:"Le travailleur est-il employé ou ouvrier ? Employé : 100 % du brut ; ouvrier : 108 % du brut.",
    onss:"Applique 13,07 % à la base ONSS de la ligne précédente.",

    tot:"Additionne A + B, puis compare avec l'ONSS : le bonus ne peut jamais dépasser l'ONSS (règle 3).",
    imp:"Salaire imposable = salaire brut − cotisations ONSS + bonus à l'emploi."
  };
  const row = (lbl,k,ind,extra) => ({ c:[lbl, {x:k}, Object.assign({k, ind, h:H[k], lbl}, extra)] });
  return { type:'tab', pts:12, short:o.short, brut:o.brut,
    q:o.q, data:o.data,
    head:['Élément','Calcul','Montant (€)'],
    rows:[
      { c:["Salaire brut", "", {g:fmt(o.brut)}] },
      row("Base ONSS (100 % ou 108 %)", 'base', 'I2', o.base),
      row("Cotisations ONSS (13,07 %)", 'onss', 'I2', Object.assign({f:'onss'}, o.onss)),
      row("Bonus – volet A", 'A', 'I3', o.A),
      row("Bonus – volet B", 'B', 'I3', o.B),
      row("Total du bonus (plafonné à l'ONSS)", 'tot', 'I3', Object.assign({f:'tot'}, o.tot)),
      Object.assign(row("Salaire imposable", 'imp', 'I4', Object.assign({f:'imp'}, o.imp)), {b:true})
    ],
    exp:o.exp };
}
const E_OUBLI = "Erreur fréquente : as-tu ajouté le bonus à l'emploi ? Salaire imposable = brut − ONSS + bonus.";

const LEVELS = [
/* ================= MISSION 1 ================= */
{ id:'L1', icon:'🧭', title:"Le chemin du brut au net",
  desc:"Les étapes de la fiche de paie, les mots à connaître et les organismes de la sécurité sociale.",
  theory:`<p>Toute entreprise doit garantir une <b>rémunération minimale</b> : le barème du secteur, fixé par une <b>CCT</b> (convention collective de travail) conclue en commission paritaire, ou à défaut le <b>RMMMG</b> (revenu minimum mensuel moyen garanti) : <b>2.233,61 € brut par mois</b> au 1er juillet 2026.</p>
  <p>Le salaire évolue grâce à l'<b>indexation</b> (il suit le coût de la vie mesuré par l'indice santé), aux <b>augmentations sectorielles</b> et aux <b>augmentations d'entreprise</b>.</p>
  <p>Chaque mois, la <b>fiche de paie</b> montre comment on passe du salaire brut au salaire net : la retenue pour la sécurité sociale (ONSS), le bonus à l'emploi pour les bas salaires, puis l'avance sur l'impôt (précompte professionnel). Observe l'exemple ci-dessous : tu apprendras à calculer chacune de ces lignes.</p>`,
  example:`<b>Emma Delattre</b>, employée administrative chez SRL Les Ateliers du Borinage (fictive), isolée, sans enfant, temps plein — octobre 2026.
  <div class="scroll"><table class="mini"><thead><tr><th>Libellé</th><th class="r">Base</th><th class="r">Taux</th><th class="r">Montant (€)</th></tr></thead><tbody>
  <tr><td>Salaire mensuel brut</td><td></td><td></td><td class="r">2.800,00</td></tr>
  <tr><td>Cotisations ONSS personnelles</td><td class="r">2.800,00</td><td class="r">13,07 %</td><td class="r">− 365,96</td></tr>
  <tr><td>Bonus à l'emploi social (volet A + volet B)</td><td></td><td></td><td class="r">+ 164,75</td></tr>
  <tr><td><b>Salaire imposable</b></td><td></td><td></td><td class="r"><b>2.598,79</b></td></tr>
  <tr><td>Précompte professionnel (formule-clé)</td><td></td><td></td><td class="r">− 423,29</td></tr>
  <tr><td>Réduction : bonus à l'emploi fiscal</td><td></td><td></td><td class="r">+ 65,71</td></tr>
  <tr><td>Cotisation spéciale de sécurité sociale</td><td></td><td></td><td class="r">pour mémoire</td></tr>
  <tr><td><b>Salaire net (avant CSS)</b></td><td></td><td></td><td class="r"><b>2.241,21</b></td></tr></tbody></table></div>`,
  plus:`<b>La rémunération selon la loi</b> comprend le salaire en espèces, les pourboires et les avantages évaluables en argent (avantages en nature, remboursements de frais, intervention dans l'abonnement de transport…), mais aussi le sursalaire des heures supplémentaires, les jours fériés et le salaire garanti en cas d'incapacité. Certains montants ne sont pas soumis aux cotisations : remboursement des frais de déplacement domicile–travail, outils et vêtements de travail…`,
  questions:[
  { type:'appar', ind:'I1', pts:8, short:"Les mots à connaître",
    q:"Associe chaque terme de la fiche de paie à sa définition.",
    items:[ {t:"Cotisations ONSS personnelles", a:'onss'}, {t:"Bonus à l'emploi", a:'bonus'}, {t:"Salaire imposable", a:'imp'},
            {t:"Précompte professionnel", a:'pp'}, {t:"Cotisation spéciale de sécurité sociale (CSS)", a:'css'}, {t:"Salaire coût", a:'cout'} ],
    options:[ {k:'onss', t:"Partie du salaire brut retenue pour financer la sécurité sociale : 13,07 %"},
              {k:'bonus', t:"Réduction des cotisations ONSS et du précompte professionnel pour les bas salaires"},
              {k:'imp', t:"Salaire brut − cotisations ONSS + bonus à l'emploi social : la base du calcul du précompte"},
              {k:'pp', t:"Avance sur l'impôt des personnes physiques, retenue chaque mois et versée au SPF Finances"},
              {k:'css', t:"Retenue supplémentaire qui dépend des revenus du ménage, non calculée dans ce cours"},
              {k:'cout', t:"Ce que le travailleur coûte réellement à l'employeur : brut + cotisations patronales + autres frais"},
              {k:'x1', t:"Montant réellement versé au travailleur, sur son compte"},
              {k:'x2', t:"Montant de la rémunération avant toute retenue sociale ou fiscale"} ],
    hint:"Pour chaque terme, demande-toi s'il s'agit d'une retenue, d'une réduction, d'un sous-total ou d'un coût pour l'employeur.",
    exp:"<b>Cotisations ONSS personnelles</b> : 13,07 % du brut pour la sécurité sociale · <b>Bonus à l'emploi</b> : réduction de l'ONSS (bonus social) et du précompte (bonus fiscal) pour les bas salaires · <b>Salaire imposable</b> : brut − ONSS + bonus, base du précompte · <b>Précompte professionnel</b> : avance mensuelle sur l'IPP (impôt des personnes physiques) · <b>CSS</b> : dépend des revenus du ménage · <b>Salaire coût</b> : brut + cotisations patronales + autres frais. Les deux définitions restantes sont celles du <b>salaire net</b> et du <b>salaire brut</b>." },

  { type:'ordre', ind:'I1', pts:8, short:"Le chemin du brut au net",
    q:"Remets dans l'ordre les lignes du chemin du brut au net, du haut vers le bas de la fiche de paie.",
    steps:[ "Salaire brut", "− Cotisations ONSS personnelles", "+ Bonus à l'emploi social", "= Salaire imposable",
            "− Précompte professionnel", "− Cotisation spéciale de sécurité sociale", "= Salaire net" ],
    distract:[ "+ Cotisations patronales ONSS", "− Bonus à l'emploi social" ],
    hint:"Le bonus à l'emploi social diminue l'ONSS : il intervient donc juste après elle. Et quel montant sert de base au précompte ?",
    exp:"On part du <b>salaire brut</b> (montant fixé dans le contrat), on retire les <b>cotisations ONSS personnelles</b> (13,07 %, sur 108 % pour un ouvrier), on ajoute le <b>bonus à l'emploi social</b> (bas salaires) et on obtient le <b>salaire imposable</b>, base de l'impôt. On retire ensuite le <b>précompte professionnel</b> (après déduction du bonus fiscal) et la <b>CSS</b>, pour arriver au <b>salaire net</b>. Les cotisations patronales ne sont jamais retenues au travailleur, et le bonus s'ajoute : il n'est jamais retiré." },

  { type:'appar', ind:'I1', pts:8, short:"Les organismes de la sécurité sociale",

/* ---------- Calculs de référence (arrondi commercial au cent à chaque étape) ---------- */
const r2 = x => Math.round((x + (x>=0?1e-9:-1e-9))*100)/100;
function bareme(x){
  if(x<=16710) return r2(x*0.2675);
  if(x<=29500) return r2(4469.93 + r2((x-16710)*0.428));
  if(x<=51050) return r2(9944.05 + r2((x-29500)*0.4815));
  return r2(20320.38 + r2((x-51050)*0.535));
}
/* Erreur reportée : valeur attendue calculée à partir des montants de l'élève (V) */
const ECF = {
  onss:  V => r2(V.base*0.1307),
  tot:   V => Math.min(r2(V.A+V.B), V.onss),
  imp:   (V,Q) => r2(Q.brut - V.onss + V.tot),
  an:    V => r2(V.imp*12),
  frais: V => V.an>20233.33 ? 6070 : r2(V.an*0.30),
  netan: V => r2(V.an - V.frais),
  ib:    V => bareme(V.netan),
  impan: V => Math.max(0, r2(V.ib - V.quot - V.enf)),
  mens:  V => r2(V.impan/12),
  pp:    V => Math.max(0, r2(V.mens - V.autres)),
  pnet:  V => r2(V.imp - V.pp),
  impSansBonus: (V,Q) => r2(Q.brut - V.onss),
  netBrut: (V,Q) => r2(Q.brut - V.pp),
  m2:    V => r2(V.p2*0.20),
  m3:    V => r2(V.p3*0.30),
  m4:    V => r2(V.p4*0.40),
  m5:    V => r2(V.p5),
  st:    V => r2(V.m1+V.m2+V.m3+V.m4+V.m5),
  smax:  V => Math.max(0, r2(V.st - V.enf))
};

/* ---------- Totaux dérivés ---------- */
function prepQuestion(Q){
  if(Q.type!=='tab') return;
  Q.inputs = {}; Q.order = [];
  Q.rows.forEach(row=>row.c.forEach(cell=>{
    if(cell && typeof cell==='object' && cell.k){ Q.inputs[cell.k] = cell; Q.order.push(cell.k); if(!cell.lbl) cell.lbl = row.c[0]; }
  }));
}
LEVELS.forEach(lv=>lv.questions.forEach(prepQuestion));
function nEl(Q){ return Q.type==='tab' ? Q.order.length : Q.type==='appar' ? Q.items.length : Q.type==='ordre' ? Q.steps.length : 1; }
LEVELS.forEach(lv=>{ lv.maxPoints = lv.questions.reduce((s,q)=>s+q.pts,0); });
const TOTAL_XP = LEVELS.reduce((s,lv)=>s+lv.maxPoints,0);
const TOTAL_Q  = LEVELS.reduce((s,lv)=>s+lv.questions.length,0);
const TOTAL_EL = LEVELS.reduce((s,lv)=>s+lv.questions.reduce((t,q)=>t+nEl(q),0),0);
function qDur(Q){ return Q.type==='tab' ? 30 + 25*nEl(Q) : 60; }
const TOTAL_DUR = LEVELS.reduce((s,lv)=>s+90+lv.questions.reduce((t,q)=>t+qDur(q),0),0);

/* ============================================================
   OUTILS
   ============================================================ */
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
function fmt(n){
  if(n===null || n===undefined || isNaN(n)) return '';
  const neg = n < -0.0049;
  let [i,d] = Math.abs(n).toFixed(2).split('.');
  i = i.replace(/\B(?=(\d{3})+(?!\d))/g,'.');
  return (neg?'−':'')+i+','+d;
}
function shuffled(n, seed){
  const a=[...Array(n).keys()]; let s=seed;
  for(let i=n-1;i>0;i--){ s=(s*9301+49297)%233280; const j=Math.floor(s/233280*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function normToken(t){
  if(t.includes(',') && t.includes('.')) return t.replace(/\./g,'').replace(',', '.');
  if(t.includes(',')) return t.replace(/,/g,'.');
  if(/^\d{1,3}(\.\d{3})+$/.test(t)) return t.replace(/\./g,'');
  return t;
}
function isExpr(s){ return /[+\-*/×÷()%]/.test(String(s).trim().replace(/^[-+−]/,'')); }
function evalExpr(raw){
  let e = String(raw).replace(/\s|\u00a0|€/g,'').replace(/×/g,'*').replace(/÷/g,'/').replace(/[−–]/g,'-');
  if(!e) return null;
  e = e.replace(/[\d.,]+/g, normToken).replace(/(\d+(?:\.\d+)?)%/g,'($1/100)');
  if(!/^[0-9+\-*/().]+$/.test(e)) return null;
  try{ const r = Function('"use strict";return ('+e+')')(); return (typeof r==='number' && isFinite(r)) ? r : null; }
  catch(err){ return null; }
}
function parseNum(raw){
  if(raw===null || raw===undefined) return null;
  const s = String(raw).trim().replace(/^−/,'-'); if(!s) return null;
  if(isExpr(s)){ const v = evalExpr(s); if(v!==null) return v; }
  const t = normToken(s.replace(/\s|\u00a0|€/g,''));
  const v = parseFloat(t); return isNaN(v) ? null : v;
}
const near = (a,b) => Math.abs(a-b) <= 0.011;           // 1 cent d'écart accepté (corrigé du cours)
function getQ(l,q){ return LEVELS[l].questions[q]; }
function key(l,q){ return l+'_'+q; }
function S(l,q){
  const k = key(l,q);
  if(!APP.qs[k]) APP.qs[k] = initQS(getQ(l,q), l, q);
  return APP.qs[k];
}
function initQS(Q,l,q){
  const seed = l*31 + q*7 + 11;
  const st = { tries:0, done:false, status:null, earned:0, showHint:false, fb:'', lock:{}, hints:[] };
  if(Q.type==='appar'){ st.sel={}; st.order=shuffled(Q.options.length, seed); }
  if(Q.type==='ordre'){ st.slots=Array(Q.steps.length).fill(null); st.pick=null; st.order=shuffled(Q.steps.length+Q.distract.length, seed); }
  if(Q.type==='tab'){ st.val={}; st.bad={}; }
  return st;
}
function levelUnlocked(l){ return l===0 || APP.lv[l-1].done; }
function levelPts(l){ return LEVELS[l].questions.reduce((s,_,i)=>s+((APP.qs[key(l,i)]||{}).earned||0),0); }
function elCounts(l,q){ /* éléments justes du 1er coup / au 2e / montrés */
  const Q=getQ(l,q), st=APP.qs[key(l,q)], n=nEl(Q), c={ok1:0,ok2:0,ko:0,n};
  if(!st) return c;
  Object.values(st.lock).forEach(v=>{ if(c[v]!==undefined) c[v]++; });
  return c;
}
function levelFirst(l){ let a=0,n=0; LEVELS[l].questions.forEach((Q,i)=>{ const c=elCounts(l,i); a+=c.ok1; n+=c.n; }); return n? a/n : 0; }
function levelCounts(l){
  const c={correct:0,hint:0,shown:0};
  LEVELS[l].questions.forEach((_,i)=>{ const st=APP.qs[key(l,i)]; if(st && st.status) c[st.status]++; });
  return c;
}
function starsOf(r){ return r>=0.85?'★★★':r>=0.65?'★★☆':r>=0.45?'★☆☆':'☆☆☆'; }
function gradeOf(r){ return r>=0.85?{g:'A',t:'Excellent'}:r>=0.65?{g:'B',t:'Très bien'}:r>=0.45?{g:'C',t:'Satisfaisant'}:{g:'D',t:'À retravailler'}; }
function medalOf(r){ return r>=0.9?'🏆':r>=0.7?'🥇':r>=0.5?'🥈':'🥉'; }
function rankIndex(score){ let k=0; RANKS.forEach((r,i)=>{ if(score >= Math.ceil(r.p*TOTAL_XP)) k=i; }); return k; }

function setScreen(name){ APP.screen = name; renderScreen(); try{ window.scrollTo({top:0,behavior:'smooth'}); }catch(e){} }
function renderScreen(){
  const m = document.getElementById('main');
  switch(APP.screen){
    case 'welcome':  m.innerHTML = renderWelcome(); break;
    case 'hub':      m.innerHTML = renderHub(); break;
    case 'brief':    m.innerHTML = renderBrief(APP.level); break;
    case 'question': m.innerHTML = renderQuestion(APP.level, APP.q); break;
    case 'bilan':    m.innerHTML = renderBilan(APP.level); break;
  }
  updateHUD();
}
function goHub(){ if(document.getElementById('emailBox')) return; setScreen('hub'); }
function firstOpen(l){ const n=LEVELS[l].questions.length; let q=0; while(q<n && S(l,q).done) q++; return Math.min(q,n-1); }
function openLevel(l){
  if(!levelUnlocked(l)) return;
  APP.level = l;
  if(APP.lv[l].done){ setScreen('bilan'); return; }
  const st = APP.lv[l];
  if(!st.started){ st.started = true; startExerciseTimer(l); setScreen('brief'); return; }
  APP.q = firstOpen(l);
  setScreen(st.pred ? 'question' : 'brief');
}
function startLevel(){ APP.q = firstOpen(APP.level); setScreen('question'); }
function goQ(q){ const l=APP.level; if(q>0 && !S(l,q-1).done) return; APP.q=q; setScreen('question'); }
function nextQ(){ const l=APP.level, n=LEVELS[l].questions.length; if(APP.q<n-1){ APP.q++; setScreen('question'); } else completeLevel(l); }

  document.getElementById('hMarks').innerHTML = RANKS.slice(1).map(k=>{
    const v = Math.ceil(k.p*TOTAL_XP);

}

const TAGS = { appar:"Appariement — 2 essais", ordre:"Remise en ordre — 2 essais", tab:"Tableau à compléter — 2 essais" };
function renderQuestion(l,q){
  const lv = LEVELS[l], Q = getQ(l,q), st = S(l,q), n = lv.questions.length;
  let dots = '';
  for(let i=0;i<n;i++){
    const s = APP.qs[key(l,i)], cls = 'qdot '+(i===q?'cur':(s&&s.status?s.status:''));
    dots += (i===0 || S(l,i-1).done) ? `<button class="${cls}" onclick="goQ(${i})" aria-label="Exercice ${i+1}"></button>` : `<span class="${cls}"></span>`;
  }
  let h = `<div class="qtop"><button class="btn btn-sm btn-ghost" onclick="setScreen('hub')">← Parcours</button>
    <button class="btn btn-sm btn-ghost" onclick="setScreen('brief')">📘 Rappel</button>
    <span class="qm">${lv.icon} Mission ${l+1} — exercice ${q+1} / ${n}</span><div class="qdots">${dots}</div></div>`;
  h += `<div class="card" id="qcard"><div class="qtag">${TAGS[Q.type]} · ${Q.pts} XP</div><div class="qtext">${Q.q}</div>`;
  if(Q.data) h += `<span class="data">${Q.data}</span>`;
  if(Q.type==='tab') h += refButtons();
  h += Q.type==='appar' ? rAppar(Q,st) : Q.type==='ordre' ? rOrdre(Q,st) : rTab(Q,st);
  h += `<div id="fbHost">${fbHTML(Q,st)}</div></div>`;
  if(st.done) h += `<div class="qnav"><button class="btn btn-primary" onclick="nextQ()">${q<n-1?'Exercice suivant ➜':'Terminer la mission ➜'}</button></div>`;
  return h;
}
function fbHTML(Q,st){
  let h = st.fb || '';
  if(!st.done && st.showHint){
    if(st.hints.length) h += `<div class="fb fb-hint"><h4>💡 Pistes pour les montants à corriger</h4><ul>${st.hints.map(x=>`<li><span class="loc">${x.loc}</span> ${x.h}</li>`).join('')}</ul></div>`;
    else if(Q.hint) h += `<div class="fb fb-hint"><h4>💡 Indice</h4><p>${Q.hint}</p></div>`;
  }
  if(st.done){
    const v = st.status==='correct' ? ['fb-ok','✅ Tout juste du premier coup — +'+st.earned+' XP']
            : st.status==='hint' ? ['fb-mid','🔄 Tout est juste après le 2e essai — +'+st.earned+' XP']
            : ['fb-bad','👁 Les montants corrects sont affichés en rouge'+(st.earned?' — +'+st.earned+' XP':'')];
    h += `<div class="fb ${v[0]}"><h4>${v[1]}</h4><p>${Q.exp}</p></div>`;
  }
  return h;
}

/* ---------- Barème commun des questions « à éléments » ---------- */
function countLocks(st){ let a=0,b=0; Object.values(st.lock).forEach(v=>{ if(v==='ok1')a++; else if(v==='ok2')b++; }); return [a,b]; }
function itemFinish(l,q,ev){
  const Q=getQ(l,q), st=S(l,q), n=nEl(Q), [a,b]=countLocks(st);
  const earned = Math.round(Q.pts*(a+0.5*b)/n);
  const status = a===n ? 'correct' : (a+b===n ? 'hint' : 'shown');
  finishQ(l,q,status,earned,ev);
}
/* Série : nombre de réponses justes d'affilée du premier coup (chaque montant compte) */
function streakAfterFirst(okList){
  if(okList.every(x=>x)){ APP.streak += okList.length; }
  else { let t=0; for(let i=okList.length-1;i>=0 && okList[i];i--) t++; APP.streak = t; }
  APP.bestStreak = Math.max(APP.bestStreak, APP.streak);
}
function firstFailFb(st,n){
  const ok = Object.keys(st.lock).length;
  st.fb = `<div class="fb fb-bad"><h4>🔒 ${ok} réponse${ok>1?'s':''} sur ${n} ${ok>1?'sont':'est'} juste${ok>1?'s':''}</h4><p>Ce qui est juste est verrouillé en vert. Corrige ce qui est encadré en rouge, puis vérifie une dernière fois.</p></div>`;
}

/* ---------- APPARIEMENT ---------- */
function rAppar(Q,st){
  let h = '<div class="appar">';
  Q.items.forEach((it,i)=>{
    const lk = st.lock[i];
    let sel = `<select ${lk||st.done?'disabled':''} onchange="setAppar(${i},this.value)" aria-label="${esc(it.t)}"><option value="">— Choisis —</option>`;
    st.order.forEach(k=>{ const o=Q.options[k]; sel += `<option value="${o.k}" ${st.sel[i]===o.k?'selected':''}>${esc(o.t)}</option>`; });
    const good = Q.options.find(o=>o.k===it.a);
    h += `<div class="arow${lk?' '+lk:''}"><div class="at">${it.t}</div>${sel}</select>${lk==='ko'?`<div class="fix">✏️ correction : ${good.t}</div>`:''}</div>`;
  });
  h += '</div>';
  if(!st.done) h += `<div class="btn-row end" style="margin-top:12px"><button class="btn btn-primary" onclick="checkAppar(event)" ${Q.items.every((_,i)=>st.sel[i])?'':'disabled'}>Vérifier (${st.tries+1}/2)</button></div>`;
  return h;
}
function setAppar(i,v){ S(APP.level,APP.q).sel[i]=v; renderScreen(); }
function checkAppar(ev){
  const l=APP.level, q=APP.q, Q=getQ(l,q), st=S(l,q), n=Q.items.length; if(st.done) return;
  st.tries++; const okList=[];
  Q.items.forEach((it,i)=>{
    if(st.lock[i]) return;
    const ok = st.sel[i]===it.a; okList.push(ok);
    if(ok) st.lock[i] = st.tries===1 ? 'ok1' : 'ok2';
    else if(st.tries===1) st.sel[i]=''; else st.lock[i]='ko';
  });
  if(st.tries===1) streakAfterFirst(okList);
  const [a] = countLocks(st);
  if(a===n || st.tries>=2){ st.fb=''; itemFinish(l,q,ev); return; }
  firstFailFb(st,n); st.showHint=true; failFirst();
}

/* ---------- REMISE EN ORDRE ---------- */
function ordreLabel(Q,k){ return k<Q.steps.length ? Q.steps[k] : Q.distract[k-Q.steps.length]; }
function rOrdre(Q,st){
  const placed = st.slots.filter(x=>x!==null);
  let h = '<div class="bank-l">Étiquettes disponibles — clique une étiquette, puis l\'emplacement où la placer :</div><div class="bank">';
  st.order.forEach(k=>{ if(placed.includes(k)) return;
    h += `<button class="chip${st.pick===k?' pick':''}" ${st.done?'disabled':''} onclick="pickOrdre(${k})">${ordreLabel(Q,k)}</button>`; });
  h += '</div><div class="slots">';
  st.slots.forEach((k,i)=>{
    const lk = st.lock[i];
    let inner = '<span class="ph">emplacement vide</span>';
    if(k!==null) inner = `<span class="chip ${lk||''}">${ordreLabel(Q,k)}${lk==='ko'?`<span class="fix">→ ${Q.steps[i]}</span>`:''}</span>`;
    else if(lk==='ko') inner = `<span class="chip ko">—<span class="fix">→ ${Q.steps[i]}</span></span>`;
    h += `<button class="slot${st.pick!==null && !lk?' target':''}" ${lk||st.done?'disabled':''} onclick="slotOrdre(${i})"><span class="sn">${i+1}</span>${inner}</button>`;
  });
  h += '</div>';
  if(!st.done) h += `<div class="btn-row end" style="margin-top:12px"><button class="btn btn-primary" onclick="checkOrdre(event)" ${st.slots.every(x=>x!==null)?'':'disabled'}>Vérifier (${st.tries+1}/2)</button></div>`;
  return h;
}
function pickOrdre(k){ const st=S(APP.level,APP.q); st.pick = st.pick===k ? null : k; renderScreen(); }
function slotOrdre(i){
  const st=S(APP.level,APP.q); if(st.lock[i]) return;
  if(st.pick!==null){ st.slots[i]=st.pick; st.pick=null; }
  else if(st.slots[i]!==null){ st.pick=st.slots[i]; st.slots[i]=null; }
  renderScreen();
}
function checkOrdre(ev){
  const l=APP.level, q=APP.q, Q=getQ(l,q), st=S(l,q), n=Q.steps.length;
  if(st.done || st.slots.some(x=>x===null)) return;
  st.tries++; st.pick=null; const okList=[];
  st.slots.forEach((k,i)=>{
    if(st.lock[i]) return;
    const ok = k===i; okList.push(ok);
    if(ok) st.lock[i] = st.tries===1 ? 'ok1' : 'ok2';
    else if(st.tries===1) st.slots[i]=null; else st.lock[i]='ko';
  });
  if(st.tries===1) streakAfterFirst(okList);
  const [a] = countLocks(st);
  if(a===n || st.tries>=2){ st.fb=''; itemFinish(l,q,ev); return; }
  firstFailFb(st,n); st.showHint=true; failFirst();
}

/* ---------- TABLEAU À COMPLÉTER ---------- */
function rTab(Q,st){
  const hasCalc = Q.head.includes('Calcul');
  let h = `<div class="tabwrap"><table class="tab"><thead><tr>${Q.head.map((x,i)=>`<th${i===Q.head.length-1||x.startsWith('Montant')?' class="r"':''}>${x}</th>`).join('')}</tr></thead><tbody>`;
  Q.rows.forEach(row=>{
    h += `<tr class="${row.b?'bold':''}">`;
    row.c.forEach((cell,ci)=>{
      const dl = esc(Q.head[ci]||'');
      if(typeof cell==='string'){ h += `<td data-l="${dl}"${ci===0?' class="nol"':(cell.match(/%$/)?' class="ctr"':'')}>${cell}</td>`; return; }
      if(cell.g!==undefined){ h += `<td class="given" data-l="${dl}">${cell.g}</td>`; return; }
      if(!cell.k && cell.x!==undefined){ /* colonne « Calcul » liée à un montant */
        const inp = Q.inputs[cell.x], lk = st.lock[cell.x];
        const show = st.done || ((lk==='ok1' || lk==='ok2') && !(st.ecf && st.ecf[cell.x]));
        h += `<td class="calc" data-l="${dl}">${show ? inp.x : (cell.blank?'':'<span class="hid">🔒 visible après correction</span>')}</td>`; return;
      }
      const k = cell.k, lk = st.lock[k], v = st.val[k]||'';
      const cls = lk ? lk : (st.bad[k] ? 'bad' : '');
      const dis = (lk || st.done) ? 'disabled' : '';
      const showX = !hasCalc && (st.done || ((lk==='ok1' || lk==='ok2') && !(st.ecf && st.ecf[k])));
      h += `<td class="cin ${cls}" data-l="${dl}"><input class="tin" inputmode="decimal" autocomplete="off" placeholder="0,00" value="${esc(v)}" ${dis}
          oninput="onTab('${k}',this)" onkeydown="if(event.key==='Enter')checkTab(event)" aria-label="${esc(cell.lbl)}">
          <span class="calc-hint" id="th-${k}">${amtHint(v)}</span>
          ${lk==='ko'?`<span class="fix">→ ${fmt(cell.v)}</span>`:''}${st.done && st.ecf && st.ecf[k]?`<span class="ecfnote">↳ juste avec tes montants (erreur reportée) ; avec les bons montants : ${fmt(cell.v)}</span>`:''}${showX?`<span class="xex">${cell.x}</span>`:''}</td>`;
    });
    h += '</tr>';
  });
  h += '</tbody></table></div>';
  if(!st.done) h += `<p class="tiny muted" style="margin-top:6px">Tu peux taper ton calcul directement dans la case (ex. 1500*13,07%) : le résultat s'affiche dessous. Arrondis au cent à chaque étape ; 1 cent d'écart est accepté.</p>
    <div class="btn-row end" style="margin-top:10px"><button class="btn btn-primary" onclick="checkTab(event)">Vérifier (${st.tries+1}/2)</button></div>`;
  return h;
}
function amtHint(v){ if(!v || !isExpr(v)) return ''; const r = evalExpr(v); return r===null ? '' : '= '+fmt(r); }
function onTab(k,el){ const st=S(APP.level,APP.q); st.val[k]=el.value; const hEl=document.getElementById('th-'+k); if(hEl) hEl.textContent = amtHint(el.value); }
function tabValues(Q,st){
  const V = {};
  Q.order.forEach(k=>{ const inp=Q.inputs[k]; let x=parseNum(st.val[k]); if(x===null) x=inp.v; if(inp.abs) x=Math.abs(x); V[k]=x; });
  return V;
}
function tabMatch(Q,inp,x,V){
  if(inp.abs) x = Math.abs(x);
  if(near(x,inp.v)) return true;
  if(inp.alt && inp.alt.some(a=>near(x,a))) return true;
  if(inp.f && ECF[inp.f]){ const e = ECF[inp.f](V,Q); if(near(x,e)) return true; }
  return false;
}
function checkTab(ev){
  const l=APP.level, q=APP.q, Q=getQ(l,q), st=S(l,q), n=Q.order.length;
  if(st.done) return;
  const missing = Q.order.filter(k=>!st.lock[k] && parseNum(st.val[k])===null);
  if(missing.length){
    st.fb = `<div class="fb fb-hint"><h4>✏️ Tableau incomplet</h4><p>Complète toutes les cases (écris <b>0</b> quand il n'y a rien) avant de vérifier. Aucun essai n'est compté.</p></div>`;
    renderScreen(); return;
  }
  st.tries++; st.hints=[]; st.bad={}; st.ecf = st.ecf || {};
  const V = tabValues(Q,st), okList=[];
  Q.order.forEach(k=>{
    if(st.lock[k]) return;
    const inp = Q.inputs[k], x = parseNum(st.val[k]);
    const ok = tabMatch(Q,inp,x,V); okList.push(ok);
    if(ok){
      st.lock[k] = st.tries===1 ? 'ok1' : 'ok2';
      const xa = inp.abs ? Math.abs(x) : x;
      if(!near(xa,inp.v) && !(inp.alt && inp.alt.some(a=>near(xa,a)))) (st.ecf = st.ecf || {})[k] = true;
      return;
    }
    if(st.tries===1){
      st.bad[k] = true;
      const xx = inp.abs ? Math.abs(x) : x;
      const spec = (inp.errs||[]).find(e=> e.f ? (ECF[e.f] && near(xx, ECF[e.f](V,Q)) && (!e.cond || e.cond(V,Q))) : near(xx,e.v));
      st.hints.push({ loc:inp.lbl.replace(/<[^>]+>/g,''), h: spec ? spec.h : inp.h });
    } else st.lock[k] = 'ko';
  });
  if(st.tries===1) streakAfterFirst(okList);
  const [a] = countLocks(st);
  if(a===n || st.tries>=2){ st.fb=''; itemFinish(l,q,ev); return; }
  firstFailFb(st,n); st.showHint=true; failFirst();
}

function evPoint(ev){
  if(ev && ev.clientX) return {x:ev.clientX, y:ev.clientY};
  const t = ev && ev.target && ev.target.getBoundingClientRect ? ev.target.getBoundingClientRect() : null;
  if(t && t.width) return {x:t.left+t.width/2, y:t.top+t.height/2};

}

    const order = {half:0,tq:1,all:2};
    const msg = st.pred===real ? "Bonne estimation, tu te connais bien ! 🔮" : order[st.pred]>order[real] ? "Tu étais un peu optimiste : relis les explications des montants manqués." : "Tu t'es sous-estimé(e) : tu en sais plus que tu ne le pensais !";
    pr = `<div class="predres">Tu avais prédit <b>« ${pTxt.t.toLowerCase()} »</b> ; tu as trouvé <b>${a1}/${an}</b> réponses du premier coup. ${msg}</div>`;
  }
  const next = l < LEVELS.length-1;
  return `<div class="card"><div class="grade"><div class="medal">${medalOf(r1)}</div>
      <div class="gr">${gr.g} — ${gr.t}</div><div class="stars" style="font-size:1.4rem">${starsOf(pts/lv.maxPoints)}</div>
      <p class="muted small">Mission ${l+1} — ${lv.title} · <b>${pts} / ${lv.maxPoints} XP</b></p></div>
    <div class="legend"><span>✅ juste du 1er coup</span><span>🔄 corrigé au 2e essai</span><span>👁 réponse montrée</span></div>
    <div class="stats"><div class="stat"><div class="v" style="color:var(--accent)">${a1}</div><div class="k">✅ du 1er coup</div></div>
      <div class="stat"><div class="v" style="color:var(--orange)">${a2}</div><div class="k">🔄 au 2e essai</div></div>
      <div class="stat"><div class="v" style="color:var(--error)">${ak}</div><div class="k">👁 montrées</div></div>
      <div class="stat"><div class="v">${Math.round(r1*100)} %</div><div class="k">réussite au 1er essai</div></div></div>
    <div class="scroll"><table class="bilan"><thead><tr><th>Exercice</th><th class="c">Résultat</th><th class="c">✅ 1er coup</th><th class="c">XP</th></tr></thead><tbody>${rows}</tbody></table></div>
    ${pr}
    <div class="btn-row" style="justify-content:space-between;margin-top:16px">
      <button class="btn btn-ghost" onclick="setScreen('hub')">🗺️ Parcours</button>
      ${next ? `<button class="btn btn-primary" onclick="openLevel(${l+1})">Mission suivante ➜</button>` : `<button class="btn btn-gold" onclick="setScreen('hub')">🏁 Voir mon bilan final ➜</button>`}</div></div>`;
}
function bilanIndicateurs(){
  const acc = {};
  const add = (id,max,got)=>{ const a = acc[id] || (acc[id]={pts:0,max:0}); a.max+=max; a.pts+=got; };
  LEVELS.forEach((lv,l)=>lv.questions.forEach((Q,i)=>{
    const st = APP.qs[key(l,i)] || {lock:{}}; const n = nEl(Q), w = Q.pts/n;
    const keys = Q.type==='tab' ? Q.order : [...Array(n).keys()];
    keys.forEach(k=>{
      const ind = Q.type==='tab' ? (Q.inputs[k].ind||Q.ind) : Q.ind;
      const lk = st.lock[k]; add(ind, w, lk==='ok1'?w:lk==='ok2'?w/2:0);
    });
  }));
  const statut = r => r>=0.8 ? 'atteint' : r>=0.5 ? 'encours' : 'nonatteint';
  return CRITERES.map(c=>{
    const inds = c.indicateurs.map(ind=>{ const a=acc[ind.id]||{pts:0,max:0}; const r=a.max?a.pts/a.max:0; return Object.assign({},ind,{ratio:r,statut:statut(r)}); });
    const tot = c.indicateurs.reduce((t,ind)=>{ const a=acc[ind.id]||{pts:0,max:0}; return {pts:t.pts+a.pts,max:t.max+a.max}; },{pts:0,max:0});
    const r = tot.max ? tot.pts/tot.max : 0;
    return { id:c.id, nom:c.nom, ratio:r, statut:statut(r), indicateurs:inds };
  });
}
const ST_LBL = { atteint:'✅ Atteint', encours:"🟠 En cours d'acquisition", nonatteint:'❌ Non atteint' };
function chapTxt(ind){ return ind.chapitres.map(c=>'« '+c+' »').join(' et '); }
function globalFirst(){ let a=0,n=0; LEVELS.forEach((lv,l)=>lv.questions.forEach((Q,i)=>{ const c=elCounts(l,i); a+=c.ok1; n+=c.n; })); return n?a/n:0; }
function renderFinal(){
  const r1 = globalFirst(), gr = gradeOf(r1), rk = RANKS[rankIndex(APP.score)];
  let rows = '';
  LEVELS.forEach((lv,l)=>{ let a1=0,a2=0,ak=0; lv.questions.forEach((_,i)=>{ const c=elCounts(l,i); a1+=c.ok1; a2+=c.ok2; ak+=c.ko; });
    const p=levelPts(l); rows += `<tr><td>${lv.icon} ${lv.title}</td><td class="c">${a1}</td><td class="c">${a2}</td><td class="c">${ak}</td><td class="c">${p} / ${lv.maxPoints}</td><td class="c stars">${starsOf(p/lv.maxPoints)}</td></tr>`; });
  let crit = '', anyRev = false;
  bilanIndicateurs().forEach(c=>{
    crit += `<div class="crit"><div class="crit-h"><span>${c.id} — ${c.nom}</span><span class="st-badge st-${c.statut}">${ST_LBL[c.statut]}</span></div>`;
    c.indicateurs.forEach(i=>{
      crit += `<div class="ind"><span class="it">${i.texte}</span><span class="st-badge st-${i.statut}">${ST_LBL[i.statut]} · ${Math.round(i.ratio*100)} %</span>`;
      if(i.statut!=='atteint'){ anyRev=true; crit += `<div class="revoir">📖 À revoir dans ton cours : <i>${chapTxt(i)}</i> — ${i.revoir}.</div>`; }
      crit += `</div>`;
    });
    crit += `</div>`;
  });
  if(!anyRev) crit += `<div class="fb fb-ok"><h4>🎉 Tous les indicateurs sont atteints</h4><p>${APPCFG.bravo}</p></div>`;
  return `<div class="card" style="border-color:rgba(255,209,102,.45)">
    <div class="grade"><div class="medal">${medalOf(r1)}</div><h2>🏁 Bilan final</h2><div class="gr">${gr.g} — ${gr.t}</div>
    <p class="muted small">${Math.round(r1*100)} % des réponses trouvées au 1er essai</p></div>
    <div class="stats"><div class="stat"><div class="v">${APP.score}</div><div class="k">XP sur ${TOTAL_XP}</div></div>
      <div class="stat"><div class="v">${rk.i}</div><div class="k">${rk.n}</div></div>
      <div class="stat"><div class="v">🔥 ${APP.bestStreak}</div><div class="k">meilleure série</div></div>
      <div class="stat"><div class="v">${APP.badges.size}/${BADGES.length}</div><div class="k">badges</div></div></div>
    <div class="legend"><span>✅ juste du 1er coup</span><span>🔄 corrigé au 2e essai</span><span>👁 réponse montrée</span></div>
    <div class="scroll"><table class="bilan"><thead><tr><th>Mission</th><th class="c">✅</th><th class="c">🔄</th><th class="c">👁</th><th class="c">XP</th><th class="c">★</th></tr></thead><tbody>${rows}</tbody></table></div>
    <h3 style="margin-top:18px">🎯 Ce que tu maîtrises</h3>${crit}
    <div class="btn-row" style="margin-top:16px;justify-content:center">
      <button class="btn btn-ghost" onclick="printBilan()">🖨️ Imprimer mon bilan</button>
      <button class="btn btn-sm btn-acc-outline" onclick="openLB('app')">🏆 Classement</button>
      <button class="btn btn-sm btn-org-outline" onclick="openLB('global')">🌍 Général</button>
      <button class="btn btn-gold" onclick="replay()">🔁 Rejouer</button></div></div>`;
}
function printBilan(){
  let rows = '';
  bilanIndicateurs().forEach(c=>c.indicateurs.forEach(i=>{
    rows += `<tr><td>${c.id} — ${c.nom}</td><td>${i.texte}</td><td>${ST_LBL[i.statut].replace(/^[^ ]+ /,'')} (${Math.round(i.ratio*100)} %)</td><td>${i.statut==='atteint'?'—':chapTxt(i)+' : '+i.revoir}</td></tr>`;
  }));
  const r1 = globalFirst();
  document.getElementById('printFiche').innerHTML = `<h1>${APPCFG.title} : mon bilan</h1>
    <p>${esc(APP.email||'Élève')} ${APP.classe?'· '+esc(APP.classe):''} · ${new Date().toLocaleDateString('fr-BE')}</p>
    <p>Score : <b>${APP.score} / ${TOTAL_XP} XP</b> · Réussite au 1er essai : <b>${Math.round(r1*100)} %</b> · Grade : <b>${gradeOf(r1).g}</b></p>
    <h2>Critères et indicateurs</h2><table><thead><tr><th>Critère</th><th>Indicateur</th><th>Statut</th><th>À revoir dans mon cours</th></tr></thead><tbody>${rows}</tbody></table>
    <p style="margin-top:12px;font-size:10px">Institut Saint-Luc Frameries — 6e Technicien en comptabilité — Fonction 5 : la rémunération (partie 2)</p>`;
  window.print();
}
function resetState(){
  APP.qs={}; APP.score=0; APP.streak=0; APP.bestStreak=0; APP.rankIdx=0;
  APP.lv=LEVELS.map(()=>({done:false,pred:null,started:false}));
  APP.badges=new Set(); APP.sent=new Set();
  APP.exerciseTimes={}; APP.exerciseScores={}; APP.scoreBeforeExercise=0; APP.exerciseStartTime=null;
  APP.level=0; APP.q=0;
}
function replay(){
  if(!confirm("Rejouer tout le parcours ? Ton score et tes badges repartent de zéro (une nouvelle partie est créée dans le classement).")) return;
  TRACKING.sessionId = new Date().toISOString(); resetState(); APP.globalTimerStart = Date.now(); setScreen('hub');
}

/* ============================================================
   TRACKING — SPEC_Tracking_Eleves_v5 (JSONP pour tous les GET)
   ============================================================ */
function showEmailModal(){
  const saved = localStorage.getItem('student_email') || '';
  document.getElementById('modalHost').innerHTML = `<div class="modal" id="emailBox"><div class="modal-box" style="max-width:460px">
    <div class="modal-h"><h3>🎓 Identification</h3></div>
    <div class="modal-b"><p class="small muted" style="margin-bottom:12px">Entre ton adresse e-mail scolaire : tes résultats seront enregistrés et tu apparaîtras dans le classement de ta classe.</p>
      <input class="field" id="emailInput" type="email" autocomplete="email" placeholder="prenom.nom@eleve.istlm.be" value="${esc(saved)}" onkeydown="if(event.key==='Enter')validateEmail()">
      <div class="err-msg" id="emailError"></div></div>
    <div class="modal-f"><button class="btn btn-primary" id="emailBtn" onclick="validateEmail()">✅ Vérifier et commencer</button></div></div></div>`;
  setTimeout(()=>{ const i=document.getElementById('emailInput'); if(i) i.focus(); },200);
}
function validateEmail(){
  const input=document.getElementById('emailInput'), btn=document.getElementById('emailBtn'), errDiv=document.getElementById('emailError');
  const email=(input.value||'').trim().toLowerCase();
  if(!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ errDiv.textContent='⚠️ Entre une adresse e-mail valide.'; return; }
  btn.textContent='⏳ Vérification…'; btn.disabled=true; errDiv.textContent='';
  const cbName='_emailCb_'+Date.now();
  const offline = msg => { errDiv.innerHTML = msg+` <button class="btn btn-sm btn-ghost" onclick="offlineMode()">Continuer sans enregistrement</button>`; btn.textContent='✅ Vérifier et commencer'; btn.disabled=false; };
  const timeout=setTimeout(()=>{ delete window[cbName]; const s=document.getElementById(cbName); if(s) s.remove(); offline('⚠️ Connexion impossible. Vérifie ta connexion internet.'); },10000);
  window[cbName]=function(resp){
    clearTimeout(timeout); delete window[cbName]; const s=document.getElementById(cbName); if(s) s.remove();
    btn.textContent='✅ Vérifier et commencer'; btn.disabled=false;
    if(resp && resp.found){
      const oldEmail=localStorage.getItem('student_email');
      localStorage.setItem('student_email',email); localStorage.setItem('student_classe',resp.classe||'');
      APP.email=email; APP.classe=resp.classe||'';
      if(oldEmail && oldEmail!==email) resetState();
      TRACKING.sessionId=new Date().toISOString();
      closeModal(); startGlobalTimer(); setScreen('welcome');
    } else errDiv.textContent="⚠️ Cette adresse e-mail n'est pas enregistrée. Vérifie l'orthographe ou demande à ton professeur de t'ajouter à la liste.";
  };
  const s=document.createElement('script'); s.id=cbName;
  s.src=`${TRACKING.scriptUrl}?action=check_email&email=${encodeURIComponent(email)}&callback=${cbName}`;
  s.onerror=()=>{ clearTimeout(timeout); delete window[cbName]; s.remove(); offline('⚠️ Erreur de connexion au serveur.'); };
  document.body.appendChild(s);
}
function offlineMode(){ APP.email=''; APP.classe=''; TRACKING.sessionId=new Date().toISOString(); closeModal(); startGlobalTimer(); setScreen('welcome'); }
function startGlobalTimer(){
  APP.globalTimerStart=Date.now(); const el=document.getElementById('globalTimer'); if(el) el.style.display='inline-flex';
  if(APP.globalTimerInterval) clearInterval(APP.globalTimerInterval);
  APP.globalTimerInterval=setInterval(updateTimerDisplay,1000); updateTimerDisplay();
}
function updateTimerDisplay(){
  const el=document.getElementById('globalTimer'); if(!el || !APP.globalTimerStart) return;
  const e=Math.floor((Date.now()-APP.globalTimerStart)/1000);
  el.textContent='⏱️ '+String(Math.floor(e/60)).padStart(2,'0')+':'+String(e%60).padStart(2,'0');
}
function startExerciseTimer(idx){ APP.exerciseStartTime=Date.now(); APP.scoreBeforeExercise=APP.score||0; }
function stopExerciseTimer(idx){
  if(!APP.exerciseStartTime) return null;
  const tempsSec=Math.round((Date.now()-APP.exerciseStartTime)/1000);
  APP.exerciseTimes[idx]=tempsSec; APP.exerciseStartTime=null;
  const deltaPoints=(APP.score||0)-APP.scoreBeforeExercise; APP.exerciseScores[idx]=deltaPoints;
  return { points:deltaPoints, temps:tempsSec };
}
function sendResult(niveau, points, pointsMax, temps){
  if(!APP.email) return;
  const payload={ email:APP.email, classe:APP.classe, app:TRACKING.appName, niveau, points, pointsMax, temps, totalNiveaux:TRACKING.totalNiveaux, sessionId:TRACKING.sessionId };
  try{ fetch(TRACKING.scriptUrl,{ method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain"}, body:JSON.stringify(payload) }).catch(err=>console.warn('[TRACKING] Erreur :',err)); }
  catch(e){ console.warn('[TRACKING]',e); }
}
let currentLBTab='app';
function openLB(tab){ document.getElementById('lbOverlay').style.display='block'; switchLBTab(tab||'app'); }
function closeLB(){ document.getElementById('lbOverlay').style.display='none'; }
function switchLBTab(tab){
  currentLBTab=tab;
  const a=document.getElementById('lbTabApp'), g=document.getElementById('lbTabGlobal');
  a.style.cssText = tab==='app' ? 'background:var(--accent);color:#07130c;border:1px solid var(--accent)' : 'background:transparent;color:var(--accent);border:1px solid var(--accent)';
  g.style.cssText = tab==='global' ? 'background:var(--orange);color:#2b1400;border:1px solid var(--orange)' : 'background:transparent;color:var(--orange);border:1px solid var(--orange)';
  const cl = APP.classe ? ' ('+APP.classe+')' : '';
  document.getElementById('lbTitle').textContent = tab==='app' ? '🏆 Classement — '+TRACKING.appName+cl : '🌍 Classement général'+cl;
  fetchLeaderboard(tab);
}
function fetchLeaderboard(tab){
  const content=document.getElementById('lbContent');
  content.innerHTML='<div class="center muted" style="padding:40px">⏳ Chargement…</div>';
  const action = tab==='app' ? 'leaderboard_app' : 'leaderboard_global';
  const cbName='_lbCb_'+Date.now();
  const timeout=setTimeout(()=>{ delete window[cbName]; const s=document.getElementById(cbName); if(s) s.remove();
    content.innerHTML=`<div class="center" style="padding:40px"><div style="color:var(--error);margin-bottom:12px">⚠️ Connexion impossible</div><button class="btn btn-sm" onclick="fetchLeaderboard('${tab}')">Réessayer</button></div>`; },10000);
  window[cbName]=function(resp){
    clearTimeout(timeout); delete window[cbName]; const s=document.getElementById(cbName); if(s) s.remove();
    const lbData = resp && (resp.leaderboard || resp.data);
    if(!lbData || lbData.length===0){ content.innerHTML='<div class="center muted" style="padding:40px">🏁 Aucun résultat pour le moment</div>'; return; }
    renderLeaderboard(lbData, tab);
  };
  let url=`${TRACKING.scriptUrl}?action=${action}&callback=${cbName}&mode=last`;
  if(tab==='app') url+=`&app=${encodeURIComponent(TRACKING.appName)}`;
  if(APP.classe) url+=`&classe=${encodeURIComponent(APP.classe)}`;
  const s=document.createElement('script'); s.id=cbName; s.src=url;
  s.onerror=()=>{ clearTimeout(timeout); delete window[cbName]; s.remove(); content.innerHTML='<div class="center" style="padding:40px;color:var(--error)">⚠️ Erreur de connexion</div>'; };
  document.body.appendChild(s);
}
function renderLeaderboard(data, tab){
  const content=document.getElementById('lbContent'), myEmail=(APP.email||'').toLowerCase();
  if(tab==='global' && data.length>0){
    data=data.slice().sort((a,b)=>{ const pa=(a.pct!=null?a.pct:(a.pourcentage||0)), pb=(b.pct!=null?b.pct:(b.pourcentage||0)); if(pb!==pa) return pb-pa; return (a.totalTemps||a.totalTime||0)-(b.totalTemps||b.totalTime||0); });
    data.forEach((e,i)=>{ e.rang=i+1; });
  }
  const me=data.find(r=>(r.email||'').toLowerCase()===myEmail);
  let html='';
  if(me){
    const pct=me.pct!=null?me.pct:(me.pourcentage||0);
    const count = tab==='app' ? (me.niveauxCompletes||me.niveaux||0) : (me.appsCompletes||me.apps||0);
    const total = tab==='app' ? (me.totalNiveaux||TRACKING.totalNiveaux||0) : (me.totalPossibleNiveaux||0);
    html+=`<div style="background:rgba(58,224,140,.08);border:1px solid rgba(58,224,140,.3);border-radius:12px;padding:14px;margin-bottom:14px;display:flex;justify-content:space-around;text-align:center;flex-wrap:wrap;gap:8px">
      <div><div style="font-size:1.3rem;font-weight:800;color:var(--accent)">#${me.rang}</div><div class="tiny muted">RANG</div></div>
      <div><div style="font-size:1.3rem;font-weight:800">${me.totalPoints}</div><div class="tiny muted">POINTS</div></div>
      <div><div style="font-size:1.3rem;font-weight:800;color:${pct>=80?'var(--accent)':pct>=50?'var(--orange)':'var(--error)'}">${pct}%</div><div class="tiny muted">RÉUSSITE</div></div>
      <div><div style="font-size:1.3rem;font-weight:800;color:var(--text2)">${total>0?count+'/'+total:count} ${tab==='app'?'missions':'apps'}</div><div class="tiny muted">PROGRESSION</div></div></div>`;
  }
  const medals=['🥇','🥈','🥉'];
  html+='<table class="bilan"><thead><tr><th>#</th><th>Élève</th><th class="c">Pts</th><th class="c">%</th><th class="c">Progression</th><th class="c">Temps</th></tr></thead><tbody>';
  data.forEach(row=>{
    const r=row.rang||0, em=(row.email||'');
    const name=em.split('@')[0].split(/[._-]/).map(w=>w.charAt(0).toUpperCase()+w.slice(1)).join(' ');
    const pct=row.pct!=null?row.pct:(row.pourcentage||0), temps=row.totalTemps||row.totalTime||0, isMe=em.toLowerCase()===myEmail;
    const count = tab==='app' ? (row.niveauxCompletes||row.niveaux||0) : (row.appsCompletes||row.apps||0);
    const total = tab==='app' ? (row.totalNiveaux||TRACKING.totalNiveaux||0) : (row.totalPossibleNiveaux||0);
    const prog = total>0 ? Math.min(100,count/total*100) : 0;
    let tStr='—'; if(temps>0){ const m=Math.floor(temps/60), s=temps%60; tStr = m>0 ? m+'m'+String(s).padStart(2,'0')+'s' : s+'s'; }
    html+=`<tr style="${isMe?'background:rgba(58,224,140,.08)':''}"><td><b>${r<=3&&r>0?medals[r-1]:r}</b></td><td style="${isMe?'font-weight:800;color:var(--accent)':''}">${esc(name)}</td>
      <td class="c" style="color:var(--accent);font-weight:700">${row.totalPoints}</td><td class="c">${pct}%</td>
      <td class="c"><div style="height:6px;background:var(--bg3);border-radius:3px;overflow:hidden;min-width:60px"><i style="display:block;height:100%;width:${prog}%;background:linear-gradient(90deg,var(--accent),var(--orange))"></i></div><span class="tiny muted">${count}/${total}</span></td>
      <td class="c tiny">${tStr}</td></tr>`;
  });
  content.innerHTML = html+'</tbody></table>';
}

/* ============================================================
   DÉMARRAGE
   ============================================================ */
function init(){ APP.rankIdx = rankIndex(APP.score); setScreen('welcome'); showEmailModal(); }
init();
